<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315CEB" />
      <stop offset="100%" stop-color="#2142B2" />
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8066" />
      <stop offset="100%" stop-color="#F5C94B" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#FFF9F0" stroke="#315CEB" stroke-width="2" />
  <!-- Antenna -->
  <line x1="24" y1="13" x2="24" y2="8" stroke="#315CEB" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="7" r="3.5" fill="url(#antennaGrad)" />
  <!-- Robot Head -->
  <rect x="11" y="13" width="26" height="22" rx="6" fill="url(#robotGrad)" />
  <!-- Eyes -->
  <circle cx="18" cy="22" r="3" fill="#F5C94B" />
  <circle cx="30" cy="22" r="3" fill="#F5C94B" />
  <circle cx="19" cy="21.5" r="1" fill="#26324B" />
  <circle cx="31" cy="21.5" r="1" fill="#26324B" />
  <!-- Smile -->
  <path d="M19 28 Q24 32 29 28" stroke="#A8E6CF" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Ears -->
  <rect x="8" y="20" width="3" height="8" rx="1.5" fill="#FF8066" />
  <rect x="37" y="20" width="3" height="8" rx="1.5" fill="#FF8066" />
</svg>
